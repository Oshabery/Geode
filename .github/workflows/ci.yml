name: CI

on:
  pull_request:
  push:
    # 作業ブランチ（claude/…）への push でもビルドとテストを確認する
    branches: [main, 'claude/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ログは公開される。署名の Team ID や秘密情報は使わない（署名なしでシミュレータ向けに実行する）
jobs:
  unit:
    name: Build + Unit Test
    # claude/… からの PR は push の実行で確認済み（同じコミットの結果が PR にも表示される）なので二重に動かさない
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=/Applications/Xcode.app
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and run unit tests
        run: ./tools/test.sh unit
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results
          path: |
            build/unit.log
            build/unit.xcresult
          if-no-files-found: ignore

  ui:
    name: UI Test + Screenshots (non-blocking)
    # claude/… からの PR は push の実行で確認済み（同じコミットの結果が PR にも表示される）なので二重に動かさない
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    runs-on: macos-latest
    timeout-minutes: 60
    # 安定するまでは結果を参考扱いにする（失敗しても PR を止めない）
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=/Applications/Xcode.app
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run UI tests
        run: ./tools/test.sh ui
      # iPad: 画面を縦に固定したまま中身だけが回るかを確かめる（iPhone の結果に関係なく実行する）
      - name: Run UI tests (iPad)
        if: success() || failure()
        run: GEODE_DEVICE=ipad ./tools/test.sh ui
      - name: Upload results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-results
          path: |
            build/ui.log
            build/screenshots
            build/ui-ipad.log
            build/screenshots-ipad
          if-no-files-found: ignore
