name: Geode
options:
  deploymentTarget:
    iOS: "17.0"
  disabledValidations: [missingConfigFiles]
# Team ID は Local.xcconfig（git 管理外）に DEVELOPMENT_TEAM = XXXXXXXXXX と書く
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Geode:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oshabery.geode
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Geode
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: ライトのオン / オフを切り替えるために使います。
        CFBundleURLTypes:
          - CFBundleURLName: geode
            CFBundleURLSchemes: [geode]
        # canOpenURL で検出できるのはここに宣言したスキームだけ(最大50件)
        LSApplicationQueriesSchemes:
          - line
          - twitter
          - instagram
          - fb
          - barcelona
          - youtube
          - comgooglemaps
          - googledrive
          - googlegmail
          - googlechrome
          - google
          - spotify
          - com.amazon.mobile.shopping
          - kindle
          - paypay
          - mercari
          - slack
          - discord
          - notion
          - chatgpt
          - claude
          - nflx
          - zoomus
          - msteams
          - whatsapp
          - tg
          - lightroom
          - leicafotos
          - vox
          - arknights
          - endfield
          - pokemontcgp
          - uber
          - twitch
          - pinterest
          - things
          - bear
          - obsidian
          - github
          - applestore
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.oshabery.geode]
    dependencies:
      - target: GeodeWidget
  GeodeWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oshabery.geode.widget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: Geode
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.oshabery.geode]
