name: LaunchGrid
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""          # ← 自分の Team ID
targets:
  LaunchGrid:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.launchgrid
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: LaunchGrid
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: launchgrid
            CFBundleURLSchemes: [launchgrid]
        # canOpenURL で検出できるのはここに宣言したスキームだけ(最大50件)
        LSApplicationQueriesSchemes:
          - line
          - twitter
          - instagram
          - fb
          - barcelona
          - youtube
          - comgooglemaps
          - googledrive
          - googlegmail
          - googlechrome
          - google
          - spotify
          - com.amazon.mobile.shopping
          - kindle
          - paypay
          - mercari
          - slack
          - discord
          - notion
          - chatgpt
          - claude
          - nflx
          - zoomus
          - msteams
          - whatsapp
          - tg
          - lightroom
          - leicafotos
          - vox
          - arknights
          - endfield
          - pokemontcgp
          - uber
          - twitch
          - pinterest
          - things
          - bear
          - obsidian
          - github
          - applestore
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.launchgrid]
    dependencies:
      - target: LaunchGridWidget
  LaunchGridWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.launchgrid.widget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: LaunchGrid
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.launchgrid]
